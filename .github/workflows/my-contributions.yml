name: Build My Contributions List

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4

      - name: Generate PRs card
        uses: Daraan/pr-stats-action@v1
        with:
          username: "ganigurgah"
          # Sadece Apache organizasyonundaki PR'ları hedefler:
          query: "author:ganigurgah org:apache is:pr" 
          theme: default
          path: profile/prs- 
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update open-source PR cards" || exit 0
          git push
